name: Refresh 2026 ad evidence

on:
  schedule:
    - cron: "13 8 * * *"
  workflow_dispatch:
    inputs:
      until:
        description: "Release-date cutoff; use 2026-11-04 for final reconciliation"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Stop routine collection after the final cutoff
        id: scope
        env:
          REQUESTED_UNTIL: ${{ inputs.until }}
        run: |
          today=$(date -u +%F)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$today" > "2026-11-04" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "until=${REQUESTED_UNTIL:-$(printf '%s\n' "$today" "2026-11-04" | sort | head -1)}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.scope.outputs.enabled == 'true'
        with:
          ref: main
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.enabled == 'true'
        with:
          node-version: "22"
      - name: Collect free source text, retaining last-good partitions
        if: steps.scope.outputs.enabled == 'true'
        env:
          UNTIL: ${{ steps.scope.outputs.until }}
        run: |
          python -m pip install -e '.[dev]'
          ruff check political_ads tests
          ruff format --check political_ads tests
          if ! political-ads registry; then
            echo "::warning::FEC refresh failed; retaining committed candidate identities"
          fi
          political-ads collect --until "$UNTIL"
          political-ads parquet
          political-ads analyze
          political-ads build
          political-ads validate
          pytest -q
      - name: Check dashboard against the new snapshot
        if: steps.scope.outputs.enabled == 'true'
        run: |
          npm ci --prefix web
          npm run lint --prefix web
          npm run test --prefix web
          npm run build --prefix web
          cd web
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Persist validated research evidence and complete analysis on main
        if: steps.scope.outputs.enabled == 'true'
        run: |
          git config user.name "Hans Hanley"
          git config user.email "$(git log -1 --format=%ae)"
          git add data/site outputs/validation.json outputs/analysis.json outputs/analysis.html outputs/analysis-ads.csv
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check -- data/site outputs/validation.json
          git commit -m "Refresh 2026 ad-language evidence"
          git push origin HEAD:main
